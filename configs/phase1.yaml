# ConvNeXt V2 scratch schema v3. 実効B64/256/1024、microbatch 64、accum 1/4/16。
schema_version: 3

experiment:
  name: phase1
  phase: phase1
  seed: 0

paths:
  dataset_root: ./data
  output_root: ./artifacts
  init_checkpoint: ./artifacts/init/convnextv2_tiny_scratch/theta_0.pt
  scratch_root: ./artifacts/work

model:
  name: convnextv2_tiny
  initialization: scratch
  num_classes: 10
  image_size: 224
  full_finetune: true
  init_seed: 0

training:
  epochs: 100
  stop_after_epoch: null
  batch_size: 64
  microbatch_size: 64
  num_workers: 4
  learning_rate: 1.0e-3
  weight_decay: 0.05
  optimizer: adamw
  scheduler: constant
  warmup_epochs: 0
  amp_dtype: bf16
  gradient_clip_norm: null
  checkpoint_interval_epochs: 1
  drop_last: false

augmentation:
  random_resized_crop: true
  horizontal_flip: true
  mixup: false
  cutmix: false
  randaugment: false

split:
  train_size: 45000
  val_size: 5000
  split_seed: 20260831

reproducibility:
  deterministic_algorithms: true
  persistent_workers: false
  pin_memory: true

evaluation:
  batch_size: 64
  num_workers: 4
  dtype: float32
  amp: false
  tf32: false

checkpoint:
  analysis_format: pt
  parameter_dtype: float32
  save_resume: true
  keep_all: true

projection:
  solver: gram_eigh
  compute_dtype: float64
  block_parameters: 16384

landscape:
  subset_size: 1000
  subset_seed: 20260831
  grid_size: 21
  margin_ratio: 0.10

logging:
  format: csv
  train_reduction: sample_mean
  gradient_reduction: update_mean

phase1:
  batch_sizes: [64, 256, 1024]
  seeds: [0, 1, 2]
  same_learning_rate: true

animation:
  fps: 5
  format: gif
  max_file_size_mb: 3.0
  width: 960
  height: 640
  min_width: 640
  palette_colors: 128
  final_hold_ms: 1000
  show_learning_rate: true
  show_train_subset_metrics: true
  show_validation_loss: true
  show_validation_accuracy: true
  show_gradient_norm: true
